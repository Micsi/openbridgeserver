name: visu-ci

on:
  push:
    branches:
      - feat/visu-mobile-skins
      - 'feat/visu-*'
  pull_request:
    branches:
      - feat/visu-mobile-skins
      - 'feat/visu-*'

# Only the Visu workspace; existing openbridgeserver workflows are untouched.
defaults:
  run:
    shell: bash

jobs:
  visu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # M2 dev-link (CONTRIBUTING-visu.md → "Dev-Link"): apps/visu depends on the
      # ionic skin via an absolute `link:` path, and the skin links back to the
      # contract the same way. The runner recreates that local topology: check out
      # the skins repo and symlink both absolute paths onto the workspace.
      # Removed at release, when the links become published npm versions.
      - uses: actions/checkout@v4
        with:
          repository: Micsi/obs-visu-skins
          ref: main
          path: .obs-visu-skins

      # pnpm normalises link: deps to workspace-RELATIVE paths in the lockfile
      # (e.g. link:../../../obs-visu-skins/...), so the runner must mirror the
      # local sibling topology in the workspace parent. The /Volumes symlinks
      # additionally satisfy the absolute specifiers in package.json.
      - name: Recreate dev-link paths
        run: |
          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          mv "$GITHUB_WORKSPACE/.obs-visu-skins" "$WORK_PARENT/obs-visu-skins"
          ln -s "$GITHUB_WORKSPACE" "$WORK_PARENT/openbridgeserver-visu-integrate"
          sudo mkdir -p /Volumes/Daten/Projekte/openbridge
          sudo ln -s "$WORK_PARENT/obs-visu-skins" /Volumes/Daten/Projekte/openbridge/obs-visu-skins
          sudo ln -s "$GITHUB_WORKSPACE" /Volumes/Daten/Projekte/openbridge/openbridgeserver-visu-integrate

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The linked skin resolves @obs/visu-contract through its own node_modules,
      # so the skins workspace needs its install too (links only, no registry).
      - name: Install (linked skins repo)
        run: pnpm --dir /Volumes/Daten/Projekte/openbridge/obs-visu-skins install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Der Web-Spiegel in den nativen Projekten (ios/App/App/public,
      # android/app/src/main/assets/public) ist per Capacitors eigener .gitignore
      # ungetrackt und existiert im Runner deshalb nicht. `cap copy` stellt ihn
      # aus dem frischen `dist/` her — sonst könnte
      # apps/visu/tests/native-platforms.test.ts die Zusage „ein Code-Stand"
      # nicht messen.
      - name: Capacitor copy (nativen Web-Spiegel herstellen)
        run: pnpm --filter @obs/visu-app exec cap copy

      # Prüft die Capacitor-Installation und beide Plattformprojekte. Braucht
      # weder Xcode-Runtime noch Android SDK.
      - name: Capacitor doctor
        run: pnpm --filter @obs/visu-app exec cap doctor

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Vitest)
        run: pnpm -r test

      - name: Import boundaries
        run: pnpm boundaries

      # Definition of Done aus #103: „App startet als PWA". Lädt den
      # Produktionsbuild über `vite preview` in einem echten Chromium und prüft
      # Mount + Service-Worker-Registrierung. Getrennt vom authz-E2E
      # (playwright.config.ts), das ein laufendes, geseedetes Backend braucht
      # und deshalb kein Gate ist.
      - name: Install Playwright Chromium
        run: pnpm --filter @obs/visu-app exec playwright install --with-deps chromium

      - name: PWA boot (Playwright gegen dist/)
        run: pnpm --filter @obs/visu-app e2e:pwa
